<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Sir Thaddeus</title>
    <!-- Runtime injects <meta name="thaddeus-runtime-token" content="..."> and friends

    <meta name="thaddeus-runtime-port" content="" />
    <meta name="thaddeus-runtime-version" content="dev" />
    <meta name="thaddeus-runtime-route" content="workspace" />
  </head>
  <body class="bg-thaddeus-mist text-thaddeus-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
