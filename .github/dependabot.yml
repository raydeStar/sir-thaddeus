version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automation"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:10"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automation"

  - package-ecosystem: "pip"
    directory: "/apps/voice-backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:20"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automation"
    ignore:
      # The immutable assets-v2 wheelhouse currently contains FastAPI 0.139.0.
      - dependency-name: "fastapi"
        versions: [">0.139.0"]
      # The packaged voice runtime is Python 3.11; NumPy 2.5+ requires 3.12.
      - dependency-name: "numpy"
        versions: [">=2.5"]
