name: CI (PR)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - dev
  push:
    branches:
      - master
      - dev

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/packages.lock.json', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Run test gate (dev/test.ps1)
        shell: pwsh
        run: |
          ./dev/test.ps1 -Restore $true

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-trx
          path: |
            artifacts/test-results/**/*.trx
            artifacts/test/**/*.trx
            **/TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Upload harness artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-artifacts
          path: |
            artifacts/harness/**
          if-no-files-found: ignore

  package-windows:
    name: Package Windows Build Artifact
    needs: test
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/packages.lock.json', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Fetch voice backend assets from GitHub Releases
        shell: pwsh
        run: ./dev/fetch-assets.ps1

      - name: Build bundled SearXNG sidecar payload
        shell: pwsh
        run: ./dev/build-searxng-package.ps1

      - name: Package win-x64 full + lite build zips + checksums
        shell: pwsh
        run: |
          $branchName = "${{ github.ref_name }}"
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          ./dev/release-package.ps1 -SkipPreflight -SelfContained -Version "$branchName-$shortSha"
          ./dev/release-package.ps1 -SkipPreflight -SelfContained -LiteBundle -Version "$branchName-$shortSha"

      - name: Upload Windows build package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-package-windows-${{ github.ref_name }}
          path: |
            artifacts/release/sir-thaddeus-win-x64-*.zip
            artifacts/release/sir-thaddeus-win-x64-*.sha256.txt
          if-no-files-found: error

  package-linux:
    name: Package Linux Build Artifact
    needs: test
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/packages.lock.json', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Package linux-x64 full + lite tar.gz
        shell: pwsh
        run: |
          $branchName = "${{ github.ref_name }}"
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          pwsh ./dev/package-cross.ps1 -Runtime linux-x64 -SelfContained -Version "$branchName-$shortSha"
          pwsh ./dev/package-cross.ps1 -Runtime linux-x64 -SelfContained -LiteBundle -Version "$branchName-$shortSha"

      - name: Upload Linux build package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-package-linux-${{ github.ref_name }}
          path: |
            artifacts/release/sir-thaddeus-linux-x64-*.tar.gz
            artifacts/release/sir-thaddeus-linux-x64-*.sha256.txt
          if-no-files-found: error

  package-macos:
    name: Package macOS Build Artifact
    needs: test
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/packages.lock.json', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Package osx-arm64 full + lite tar.gz
        shell: pwsh
        run: |
          $branchName = "${{ github.ref_name }}"
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          pwsh ./dev/package-cross.ps1 -Runtime osx-arm64 -SelfContained -Version "$branchName-$shortSha"
          pwsh ./dev/package-cross.ps1 -Runtime osx-arm64 -SelfContained -LiteBundle -Version "$branchName-$shortSha"

      - name: Upload macOS build package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-package-macos-${{ github.ref_name }}
          path: |
            artifacts/release/sir-thaddeus-osx-arm64-*.tar.gz
            artifacts/release/sir-thaddeus-osx-arm64-*.sha256.txt
          if-no-files-found: error

  smoke-test:
    name: Smoke Test Package (Windows)
    needs: [package-windows, package-linux, package-macos]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev'
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Download build package artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-package-windows-${{ github.ref_name }}
          path: artifacts/release

      - name: Run smoke test on packaged zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path artifacts/release -Filter "sir-thaddeus-win-x64-*-full.zip" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $zip) { Write-Error "No win-x64 full zip found in artifacts/release"; exit 1 }
          ./dev/smoke-test.ps1 -ZipPath $zip.FullName -SkipLaunch

  smoke-test-linux:
    name: Smoke Test Package (Linux)
    needs: [package-linux]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Download Linux build package artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-package-linux-${{ github.ref_name }}
          path: artifacts/release

      - name: Run cross-platform smoke test on tar.gz
        shell: pwsh
        run: |
          $archive = Get-ChildItem -Path artifacts/release -Filter "sir-thaddeus-linux-x64-*-full.tar.gz" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $archive) { Write-Error "No linux-x64 full tar.gz found in artifacts/release"; exit 1 }
          ./dev/smoke-test-cross.ps1 -ArchivePath $archive.FullName -SkipLaunch

  smoke-test-macos:
    name: Smoke Test Package (macOS)
    needs: [package-macos]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev'
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Download macOS build package artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-package-macos-${{ github.ref_name }}
          path: artifacts/release

      - name: Run cross-platform smoke test on tar.gz
        shell: pwsh
        run: |
          $archive = Get-ChildItem -Path artifacts/release -Filter "sir-thaddeus-osx-arm64-*-full.tar.gz" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $archive) { Write-Error "No osx-arm64 full tar.gz found in artifacts/release"; exit 1 }
          ./dev/smoke-test-cross.ps1 -ArchivePath $archive.FullName -SkipLaunch

  publish:
    name: Publish Rolling Release
    needs: [package-windows, package-linux, package-macos, smoke-test, smoke-test-linux, smoke-test-macos]
    if: >
      always() &&
      needs.package-windows.result == 'success' &&
      needs.package-linux.result == 'success' &&
      needs.package-macos.result == 'success' &&
      (needs.smoke-test.result == 'success' || needs.smoke-test.result == 'skipped') &&
      (needs.smoke-test-linux.result == 'success' || needs.smoke-test-linux.result == 'skipped') &&
      (needs.smoke-test-macos.result == 'success' || needs.smoke-test-macos.result == 'skipped') &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows build package artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-package-windows-${{ github.ref_name }}
          path: release-assets

      - name: Download Linux build package artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-package-linux-${{ github.ref_name }}
          path: release-assets

      - name: Download macOS build package artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-package-macos-${{ github.ref_name }}
          path: release-assets

      - name: Set rolling release tag name
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "title=Latest Build (master)" >> $GITHUB_OUTPUT
            echo "body=Rolling release from master branch. Commit: ${{ github.sha }}. Includes separate Windows, Linux, and macOS packages." >> $GITHUB_OUTPUT
          else
            echo "tag=latest-dev" >> $GITHUB_OUTPUT
            echo "title=Latest Dev Build" >> $GITHUB_OUTPUT
            echo "body=Rolling release from dev branch. Commit: ${{ github.sha }}. Includes separate Windows, Linux, and macOS packages." >> $GITHUB_OUTPUT
          fi

      - name: Delete existing rolling release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --yes 2>/dev/null || true
          git -c http.extraHeader="Authorization: bearer $GH_TOKEN" \
            ls-remote --tags origin "${{ steps.tag.outputs.tag }}" \
            | grep -q . && \
            git push --delete \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
              "refs/tags/${{ steps.tag.outputs.tag }}" 2>/dev/null || true

      - name: Create rolling GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.title }}
          body: ${{ steps.tag.outputs.body }}
          prerelease: false
          make_latest: false
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/*.sha256.txt
