name: CI (PR)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - dev
  push:
    branches:
      - master
      - dev

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/packages.lock.json', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Run test gate (dev/test.ps1)
        shell: pwsh
        run: |
          ./dev/test.ps1 -Restore $true

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-trx
          path: |
            artifacts/test-results/**/*.trx
            artifacts/test/**/*.trx
            **/TestResults/**/*.trx
          if-no-files-found: ignore

  package:
    name: Package Build Artifact
    needs: test
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/packages.lock.json', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Fetch voice backend assets from GitHub Releases
        shell: pwsh
        run: ./dev/fetch-assets.ps1

      - name: Build bundled SearXNG sidecar payload
        shell: pwsh
        run: ./dev/build-searxng-package.ps1

      - name: Package build zip + checksums
        shell: pwsh
        run: |
          $branchName = "${{ github.ref_name }}"
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          ./dev/release-package.ps1 -SkipPreflight -SelfContained -Version "$branchName-$shortSha"

      - name: Upload build package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-package-assets-${{ github.ref_name }}
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256.txt
          if-no-files-found: error

  smoke-test:
    name: Smoke Test Package
    needs: package
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Download build package artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-package-assets-${{ github.ref_name }}
          path: artifacts/release

      - name: Run smoke test on packaged zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path artifacts/release -Filter "sir-thaddeus-*.zip" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $zip) { Write-Error "No zip found in artifacts/release"; exit 1 }
          ./dev/smoke-test.ps1 -ZipPath $zip.FullName -SkipLaunch

  publish:
    name: Publish Rolling Release
    needs: [package, smoke-test]
    if: >
      always() &&
      needs.package.result == 'success' &&
      (needs.smoke-test.result == 'success' || needs.smoke-test.result == 'skipped') &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build package artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-package-assets-${{ github.ref_name }}
          path: release-assets

      - name: Set rolling release tag name
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "title=Latest Build (master)" >> $GITHUB_OUTPUT
            echo "body=Rolling release from master branch. Commit: ${{ github.sha }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest-dev" >> $GITHUB_OUTPUT
            echo "title=Latest Dev Build" >> $GITHUB_OUTPUT
            echo "body=Rolling release from dev branch. Commit: ${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Delete existing rolling release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --yes 2>/dev/null || true
          git -c http.extraHeader="Authorization: bearer $GH_TOKEN" \
            ls-remote --tags origin "${{ steps.tag.outputs.tag }}" \
            | grep -q . && \
            git push --delete \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
              "refs/tags/${{ steps.tag.outputs.tag }}" 2>/dev/null || true

      - name: Create rolling GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.title }}
          body: ${{ steps.tag.outputs.body }}
          prerelease: false
          make_latest: false
          files: |
            release-assets/*.zip
            release-assets/*.sha256.txt
