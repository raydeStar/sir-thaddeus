name: CI (Release Gate)

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  preflight:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/packages.lock.json', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Run preflight gate (dev/preflight.ps1)
        shell: pwsh
        run: |
          ./dev/preflight.ps1

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-test-results-trx
          path: |
            artifacts/test-results/**/*.trx
            artifacts/test/**/*.trx
            **/TestResults/**/*.trx
          if-no-files-found: ignore
