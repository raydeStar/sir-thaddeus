name: CI (Release Gate)

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  preflight:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/packages.lock.json', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Run preflight gate (dev/preflight.ps1)
        shell: pwsh
        run: |
          ./dev/preflight.ps1

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-test-results-trx
          path: |
            artifacts/test-results/**/*.trx
            artifacts/test/**/*.trx
            **/TestResults/**/*.trx
          if-no-files-found: ignore

  package:
    name: Package Release Artifact
    needs: preflight
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/packages.lock.json', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Package release zip + checksums
        shell: pwsh
        run: |
          ./dev/release-package.ps1 -SkipPreflight -SelfContained -Version "${{ github.ref_name }}"

      - name: Upload release package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-package-assets
          path: |
            artifacts/release/*.zip
            artifacts/release/*.zip.sha256.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release package artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-package-assets
          path: release-assets

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/*.zip.sha256.txt
