name: CI (Release Gate)

# ═══════════════════════════════════════════════════════════════════════
#  Tag-triggered release gate.
#
#  Push a tag matching v* (or trigger manually) to run:
#    1) preflight       — full test suite on Windows
#    2) package-windows — self-contained win-x64 zip + offline smoke gate
#    3) package-linux   — self-contained linux-x64 tar.gz (ubuntu runner)
#    4) package-macos   — self-contained osx-arm64 tar.gz (macos runner)
#    5) publish         — create GitHub Release with all three packages
#
#  Windows and Linux/macOS packaging run in parallel after preflight.
#  macOS minutes (10× multiplier) are gated to tags only; PRs use only
#  Windows + Linux.
# ═══════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  preflight:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/packages.lock.json', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Run preflight gate (dev/preflight.ps1)
        shell: pwsh
        run: |
          ./dev/preflight.ps1

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preflight-test-results-trx
          path: |
            artifacts/test-results/**/*.trx
            artifacts/test/**/*.trx
            **/TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Upload harness artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preflight-harness-artifacts
          path: |
            artifacts/harness/**
          if-no-files-found: ignore

  package:
    name: Package Windows (win-x64)
    needs: preflight
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/packages.lock.json', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Fetch voice backend assets from GitHub Releases
        shell: pwsh
        run: ./dev/fetch-assets.ps1

      - name: Build bundled SearXNG sidecar payload
        shell: pwsh
        run: ./dev/build-searxng-package.ps1

      - name: Package win-x64 full + lite zips + checksums
        shell: pwsh
        run: |
          ./dev/release-package.ps1 -SkipPreflight -SelfContained -Version "${{ github.ref_name }}"
          ./dev/release-package.ps1 -SkipPreflight -SelfContained -LiteBundle -Version "${{ github.ref_name }}"

      - name: Smoke test packaged zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path artifacts/release -Filter "sir-thaddeus-win-x64-*-full.zip" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $zip) { Write-Error "No win-x64 full zip found in artifacts/release"; exit 1 }
          ./dev/smoke-test.ps1 -ZipPath $zip.FullName -SkipLaunch

      - name: Upload Windows package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-package-windows
          path: |
            artifacts/release/sir-thaddeus-win-x64-*.zip
            artifacts/release/sir-thaddeus-win-x64-*.sha256.txt
          if-no-files-found: error

  package-linux:
    name: Package Linux (linux-x64)
    needs: preflight
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/packages.lock.json', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Package linux-x64 full + lite tar.gz
        shell: pwsh
        run: |
          pwsh ./dev/package-cross.ps1 -Runtime linux-x64 -SelfContained -Version "${{ github.ref_name }}"
          pwsh ./dev/package-cross.ps1 -Runtime linux-x64 -SelfContained -LiteBundle -Version "${{ github.ref_name }}"

      - name: Upload Linux package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-package-linux
          path: |
            artifacts/release/sir-thaddeus-linux-x64-*.tar.gz
            artifacts/release/sir-thaddeus-linux-x64-*.sha256.txt
          if-no-files-found: error

  package-macos:
    name: Package macOS (osx-arm64)
    needs: preflight
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/packages.lock.json', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Package osx-arm64 full + lite tar.gz
        shell: pwsh
        run: |
          pwsh ./dev/package-cross.ps1 -Runtime osx-arm64 -SelfContained -Version "${{ github.ref_name }}"
          pwsh ./dev/package-cross.ps1 -Runtime osx-arm64 -SelfContained -LiteBundle -Version "${{ github.ref_name }}"

      - name: Upload macOS package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-package-macos
          path: |
            artifacts/release/sir-thaddeus-osx-arm64-*.tar.gz
            artifacts/release/sir-thaddeus-osx-arm64-*.sha256.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [package, package-linux, package-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: release-package-windows
          path: release-assets

      - name: Download Linux package
        uses: actions/download-artifact@v8
        with:
          name: release-package-linux
          path: release-assets

      - name: Download macOS package
        uses: actions/download-artifact@v8
        with:
          name: release-package-macos
          path: release-assets

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          # Public release surface: only the full bundles. Lite variants stay
          # built as CI artifacts (downloadable via the Actions tab) but are
          # not promoted to the Releases page to keep the download UX simple.
          files: |
            release-assets/*-full.zip
            release-assets/*-full.tar.gz
            release-assets/*-full.zip.sha256.txt
            release-assets/*-full.tar.gz.sha256.txt
