name: Promote Dev to Production

# ═══════════════════════════════════════════════════════════════════════
#  Promotion Pipeline: dev → master → tagged release
#
#  Triggered manually from the Actions tab. Gates:
#    1) preflight         — full test suite (Windows)
#    2) package-windows   — self-contained win-x64 zip + smoke gate
#    3) package-linux     — self-contained linux-x64 tar.gz
#    4) package-macos     — self-contained osx-arm64 tar.gz
#    5) smoke-test        — validate win-x64 zip (file + offline dep gate)
#    6) merge             — fast-forward dev into master
#    7) release           — tag + GitHub Release with all three packages
#
#  All three package jobs run in parallel after preflight.
#  Use skip_macos=true for emergency hotfixes to avoid macOS minute cost.
# ═══════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.2.0)"
        required: true
        type: string
      skip_merge:
        description: "Skip the merge step (tag master as-is)"
        required: false
        type: boolean
        default: false
      skip_macos:
        description: "Skip macOS package (emergency hotfix escape hatch)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────
  #  Gate 1: Full test suite (Release config)
  # ─────────────────────────────────────────────────────────────────
  preflight:
    name: "Gate: Preflight Tests"
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev
          lfs: false
          fetch-depth: 0

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/packages.lock.json', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Run preflight gate
        shell: pwsh
        run: ./dev/preflight.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: promote-test-results
          path: |
            artifacts/test-results/**/*.trx
            **/TestResults/**/*.trx
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────
  #  Gate 2a: Windows package
  # ─────────────────────────────────────────────────────────────────
  package-windows:
    name: "Gate: Package Windows (win-x64)"
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev
          lfs: false

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/packages.lock.json', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Fetch voice backend assets
        shell: pwsh
        run: ./dev/fetch-assets.ps1

      - name: Build bundled SearXNG sidecar payload
        shell: pwsh
        run: ./dev/build-searxng-package.ps1

      - name: Package win-x64 full + lite release zips
        shell: pwsh
        run: |
          ./dev/release-package.ps1 -SkipPreflight -SelfContained -Version "${{ inputs.version }}"
          ./dev/release-package.ps1 -SkipPreflight -SelfContained -LiteBundle -Version "${{ inputs.version }}"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: promote-package-windows
          path: |
            artifacts/release/sir-thaddeus-win-x64-*.zip
            artifacts/release/sir-thaddeus-win-x64-*.sha256.txt
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────
  #  Gate 2b: Linux package
  # ─────────────────────────────────────────────────────────────────
  package-linux:
    name: "Gate: Package Linux (linux-x64)"
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev
          lfs: false

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/packages.lock.json', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Package linux-x64 full + lite tar.gz
        shell: pwsh
        run: |
          pwsh ./dev/package-cross.ps1 -Runtime linux-x64 -SelfContained -Version "${{ inputs.version }}"
          pwsh ./dev/package-cross.ps1 -Runtime linux-x64 -SelfContained -LiteBundle -Version "${{ inputs.version }}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: promote-package-linux
          path: |
            artifacts/release/sir-thaddeus-linux-x64-*.tar.gz
            artifacts/release/sir-thaddeus-linux-x64-*.sha256.txt
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────
  #  Gate 2c: macOS package (10× minutes — skip for hotfixes)
  # ─────────────────────────────────────────────────────────────────
  package-macos:
    name: "Gate: Package macOS (osx-arm64)"
    needs: preflight
    if: ${{ !inputs.skip_macos }}
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev
          lfs: false

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.fsproj', '**/packages.lock.json', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Package osx-arm64 full + lite tar.gz
        shell: pwsh
        run: |
          pwsh ./dev/package-cross.ps1 -Runtime osx-arm64 -SelfContained -Version "${{ inputs.version }}"
          pwsh ./dev/package-cross.ps1 -Runtime osx-arm64 -SelfContained -LiteBundle -Version "${{ inputs.version }}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: promote-package-macos
          path: |
            artifacts/release/sir-thaddeus-osx-arm64-*.tar.gz
            artifacts/release/sir-thaddeus-osx-arm64-*.sha256.txt
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────
  #  Gate 3: Smoke test the Windows packaged zip
  # ─────────────────────────────────────────────────────────────────
  smoke-test:
    name: "Gate: Smoke Test"
    needs: [package-windows, package-linux, package-macos]
    if: >
      always() &&
      needs.package-windows.result == 'success' &&
      needs.package-linux.result == 'success' &&
      (needs.package-macos.result == 'success' || needs.package-macos.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev
          lfs: false

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: promote-package-windows
          path: artifacts/release

      - name: Run smoke test
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path artifacts/release -Filter "sir-thaddeus-win-x64-*-full.zip" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $zip) { Write-Error "No win-x64 full zip found"; exit 1 }
          ./dev/smoke-test.ps1 -ZipPath $zip.FullName -SkipLaunch

  # ─────────────────────────────────────────────────────────────────
  #  Gate 4: Merge dev → master (fast-forward)
  # ─────────────────────────────────────────────────────────────────
  merge:
    name: "Merge dev → master"
    needs: smoke-test
    if: ${{ !inputs.skip_merge }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for merge)
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tag does not already exist
        run: |
          if git rev-parse "refs/tags/${{ inputs.version }}" >/dev/null 2>&1; then
            echo "ERROR: Tag ${{ inputs.version }} already exists."
            exit 1
          fi

      - name: Merge dev into master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          git merge origin/dev --ff-only \
            -m "Promote dev to master for release ${{ inputs.version }}"
          git push origin master

  # ─────────────────────────────────────────────────────────────────
  #  Gate 5: Tag + publish GitHub Release (all platforms)
  # ─────────────────────────────────────────────────────────────────
  release:
    name: "Tag & Publish Release"
    needs: [smoke-test, merge]
    if: >
      always() &&
      needs.smoke-test.result == 'success' &&
      (needs.merge.result == 'success' || needs.merge.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ inputs.version }}" -m "Release ${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: promote-package-windows
          path: release-assets

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: promote-package-linux
          path: release-assets

      - name: Download macOS artifacts
        if: ${{ !inputs.skip_macos }}
        uses: actions/download-artifact@v8
        with:
          name: promote-package-macos
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: "Sir Thaddeus ${{ inputs.version }}"
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/*.sha256.txt

