use_default_settings: true

general:
  instance_name: "Sir Thaddeus Search"
  enable_metrics: false

search:
  autocomplete: ""
  safe_search: 0
  formats:
    - html
    - json

server:
  bind_address: "__HOST__"
  port: __PORT__
  base_url: "http://__HOST__:__PORT__/"
  secret_key: "__SECRET__"
  limiter: false
  image_proxy: false
  public_instance: false
  method: "GET"

engines:
  - name: google
    disabled: true
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
  - name: ahmia
    disabled: true
  - name: torch
    disabled: true

