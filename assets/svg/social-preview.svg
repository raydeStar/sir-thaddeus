<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Sir Thaddeus</title>
  <desc id="desc">Private AI that answers to you</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111D"/>
      <stop offset="0.58" stop-color="#10253F"/>
      <stop offset="1" stop-color="#081522"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07111D" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#07111D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#07111D" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0C36C"/>
      <stop offset="0.5" stop-color="#B98532"/>
      <stop offset="1" stop-color="#F5D695"/>
    </linearGradient>
    <clipPath id="portrait"><rect x="42" y="42" width="490" height="556" rx="28"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <g opacity="0.14" fill="none" stroke="#D3A24E">
    <circle cx="260" cy="320" r="240"/>
    <circle cx="260" cy="320" r="190"/>
    <path d="M380 90 C540 110 520 200 650 220 M380 550 C540 530 520 440 650 420"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="42" y="42" width="490" height="556" rx="28" fill="#08121E" stroke="#D3A24E" stroke-opacity="0.42" stroke-width="2"/>
    <image href="../images/raven-familiar.png" x="42" y="42" width="490" height="556" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)"/>
    <rect x="42" y="42" width="490" height="556" rx="28" fill="url(#fade)"/>
  </g>

  <!-- Compact signet -->
  <g transform="translate(612 90)">
    <circle r="42" fill="#091421" stroke="url(#brass)" stroke-width="2"/>
    <circle r="34" fill="none" stroke="#F4D590" stroke-opacity="0.18"/>
    <g font-family="Georgia, 'Times New Roman', serif" font-size="43" font-weight="700">
      <text x="-12" y="14" text-anchor="middle" fill="#F5EBD8">S</text>
      <text x="13" y="14" text-anchor="middle" fill="url(#brass)">T</text>
    </g>
    <path d="M-3 -2 L0 -6 L3 -2 L0 2Z" fill="#F0C36C"/>
  </g>

  <text x="682" y="82" font-family="Consolas, 'Cascadia Mono', monospace" font-size="17" letter-spacing="5" fill="#D3A24E">SIR THADDEUS</text>
  <text x="682" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#91A3B7">PRIVATE AI FOR WINDOWS</text>
  <line x1="582" y1="154" x2="1205" y2="154" stroke="#D3A24E" stroke-opacity="0.3"/>

  <text x="582" y="238" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" fill="#F5EBD8">Private AI that</text>
  <text x="582" y="302" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-style="italic" fill="#F5EBD8">answers to you.</text>
  <text x="582" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#B9C6D4">Your model. Your memory. Your permission.</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="18">
    <rect x="582" y="408" width="190" height="42" rx="21" fill="#172A3E" stroke="#D3A24E" stroke-opacity="0.35"/>
    <text x="677" y="435" text-anchor="middle" fill="#F5EBD8">Local models</text>
    <rect x="788" y="408" width="190" height="42" rx="21" fill="#172A3E" stroke="#D3A24E" stroke-opacity="0.35"/>
    <text x="883" y="435" text-anchor="middle" fill="#F5EBD8">Private memory</text>
    <rect x="994" y="408" width="211" height="42" rx="21" fill="#152131" stroke="#D3A24E" stroke-opacity="0.55"/>
    <text x="1099.5" y="435" text-anchor="middle" fill="#F0C36C">Visible permission</text>
  </g>

  <text x="582" y="514" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic" fill="#C8D3E0">Your thoughts deserve a butler, not an audience.</text>
  <text x="582" y="570" font-family="Consolas, 'Cascadia Mono', monospace" font-size="15" letter-spacing="2" fill="#6F8499">OPEN SOURCE · LOCAL-FIRST · ZERO TELEMETRY</text>

  <rect x="12" y="12" width="1256" height="616" rx="30" fill="none" stroke="#D3A24E" stroke-opacity="0.22" stroke-width="2"/>
</svg>
