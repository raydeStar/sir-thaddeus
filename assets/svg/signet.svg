<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sir Thaddeus signet</title>
  <desc id="desc">An interwoven S and T monogram inside a brass seal</desc>
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0C36C"/>
      <stop offset="0.5" stop-color="#B98532"/>
      <stop offset="1" stop-color="#F5D695"/>
    </linearGradient>
    <radialGradient id="field" cx="0.42" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#18304A"/>
      <stop offset="1" stop-color="#07111D"/>
    </radialGradient>
  </defs>
  <circle cx="80" cy="80" r="75" fill="url(#field)" stroke="#C79239" stroke-width="2"/>
  <circle cx="80" cy="80" r="64" fill="none" stroke="#F6E8CC" stroke-opacity="0.18"/>
  <circle cx="80" cy="80" r="56" fill="none" stroke="#C79239" stroke-opacity="0.22" stroke-dasharray="2 6"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700">
    <text x="59" y="105" text-anchor="middle" fill="#F5EBD8">S</text>
    <text x="102" y="105" text-anchor="middle" fill="url(#brass)">T</text>
  </g>
  <path d="M75 78 L80 72 L85 78 L80 84Z" fill="#F0C36C"/>
  <path d="M65 137 L80 129 L95 137 L80 145Z" fill="url(#brass)" opacity="0.9"/>
