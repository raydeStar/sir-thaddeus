<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sir Thaddeus — a private, local-first AI assistant for Windows. Your thoughts deserve a butler, not an audience.">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#0B1626"/>
      <stop offset="0.55" stop-color="#142B49"/>
      <stop offset="1" stop-color="#1B3F6E"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8F6F35"/>
      <stop offset="0.5" stop-color="#C9A45C"/>
      <stop offset="1" stop-color="#8F6F35"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#2B527F" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0B1626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardsheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101F35"/>
      <stop offset="1" stop-color="#0B1626"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <rect width="1280" height="640" fill="url(#ground)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- plate border + corner ticks -->
  <rect x="22.5" y="22.5" width="1235" height="595" fill="none" stroke="#C9A45C" stroke-opacity="0.26" stroke-width="1"/>
  <g stroke="#C9A45C" stroke-opacity="0.55" stroke-width="1.5" fill="none">
    <path d="M 44 64 V 44 H 64"/>
    <path d="M 1216 44 H 1236 V 64"/>
    <path d="M 1236 576 V 596 H 1216"/>
    <path d="M 64 596 H 44 V 576"/>
  </g>

  <!-- ── left column ── -->
  <!-- bow tie -->
  <g transform="translate(96 118) scale(0.92)">
    <path d="M -8 0 L -46 -17 Q -52 -19 -52 -12 L -52 12 Q -52 19 -46 17 L -8 0 Z" fill="url(#brass)" transform="translate(52 0)"/>
    <path d="M 8 0 L 46 -17 Q 52 -19 52 -12 L 52 12 Q 52 19 46 17 L 8 0 Z" fill="url(#brass)" transform="translate(52 0)"/>
    <rect x="43" y="-8" width="18" height="16" rx="3" fill="#C9A45C"/>
    <rect x="43" y="-8" width="18" height="16" rx="3" fill="none" stroke="#0B1626" stroke-opacity="0.35"/>
  </g>

  <!-- title -->
  <text x="92" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700"
        letter-spacing="4" fill="#EFE9DA">Sir Thaddeus</text>

  <!-- tagline -->
  <text x="94" y="292" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic"
        fill="#B9C6D8">Your thoughts deserve a butler,</text>
  <text x="94" y="326" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-style="italic"
        fill="#B9C6D8">not an audience.</text>

  <!-- brass rule -->
  <line x1="96" y1="360" x2="560" y2="360" stroke="url(#brass)" stroke-width="1.25"/>

  <!-- chips -->
  <g font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="15" letter-spacing="1.5">
    <rect x="94" y="386" width="150" height="34" rx="17" fill="none" stroke="#C9A45C" stroke-opacity="0.6"/>
    <text x="169" y="408" text-anchor="middle" fill="#C9A45C">LOCAL-FIRST</text>
    <rect x="258" y="386" width="170" height="34" rx="17" fill="none" stroke="#C9A45C" stroke-opacity="0.6"/>
    <text x="343" y="408" text-anchor="middle" fill="#C9A45C">NO TELEMETRY</text>
    <rect x="442" y="386" width="252" height="34" rx="17" fill="none" stroke="#C9A45C" stroke-opacity="0.6"/>
    <text x="568" y="408" text-anchor="middle" fill="#C9A45C">MEASURED, NOT GUESSED</text>
  </g>

  <!-- stack line -->
  <text x="94" y="462" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="16"
        letter-spacing="2" fill="#7E97B5">C#&#160;·&#160;.NET 10&#160;·&#160;MCP&#160;·&#160;WINDOWS&#160;·&#160;RUNS FULLY OFFLINE</text>

  <!-- repo -->
  <text x="94" y="576" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="16"
        letter-spacing="1" fill="#7E97B5" opacity="0.85">github.com/raydeStar/sir-thaddeus</text>

  <!-- ── right: consent-gate terminal card ── -->
  <g>
    <rect x="742" y="120" width="450" height="330" rx="10" fill="url(#cardsheen)" stroke="#C9A45C" stroke-opacity="0.4"/>
    <!-- title bar -->
    <rect x="742" y="120" width="450" height="38" rx="10" fill="#0D1B2E"/>
    <rect x="742" y="148" width="450" height="10" fill="#0D1B2E"/>
    <circle cx="768" cy="139" r="5.5" fill="#B3372E" opacity="0.85"/>
    <circle cx="788" cy="139" r="5.5" fill="#C9A45C" opacity="0.85"/>
    <circle cx="808" cy="139" r="5.5" fill="#2F6B4F" opacity="0.85"/>
    <text x="1176" y="145" text-anchor="end" font-family="Consolas, 'Cascadia Mono', Menlo, monospace"
          font-size="13" fill="#7E97B5">permission gate</text>

    <g font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="16">
      <text x="770" y="196" fill="#7E97B5">&gt; summarize my meeting notes</text>
      <text x="770" y="232" fill="#EFE9DA">tool request: <tspan fill="#C9A45C">file_read</tspan> — Documents/notes.md</text>

      <!-- consent buttons -->
      <g font-size="14.5" letter-spacing="0.5">
        <rect x="770" y="256" width="76" height="32" rx="6" fill="none" stroke="#B3372E" stroke-opacity="0.8"/>
        <text x="808" y="277" text-anchor="middle" fill="#D08A83">Deny</text>
        <rect x="856" y="256" width="76" height="32" rx="6" fill="#C9A45C"/>
        <text x="894" y="277" text-anchor="middle" fill="#0B1626" font-weight="700">Once</text>
        <rect x="942" y="256" width="96" height="32" rx="6" fill="none" stroke="#7E97B5" stroke-opacity="0.7"/>
        <text x="990" y="277" text-anchor="middle" fill="#9FB2C8">Session</text>
        <rect x="1048" y="256" width="92" height="32" rx="6" fill="none" stroke="#7E97B5" stroke-opacity="0.7"/>
        <text x="1094" y="277" text-anchor="middle" fill="#9FB2C8">Always</text>
      </g>

      <text x="770" y="326" fill="#7FC383">&#10003; executed locally</text>
      <text x="770" y="356" fill="#7FC383">&#10003; 0 bytes left this machine</text>
      <text x="770" y="386" fill="#7FC383">&#10003; audit trail written</text>

      <!-- caret -->
      <text x="770" y="424" fill="#7E97B5">&gt;</text>
      <rect x="788" y="410" width="9" height="17" fill="#C9A45C">
        <animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
