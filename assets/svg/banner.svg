<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sir Thaddeus — your thoughts deserve a butler, not an audience">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1D31"/>
      <stop offset="0.55" stop-color="#16304F"/>
      <stop offset="1" stop-color="#1B3F6E"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8F6F35"/>
      <stop offset="0.5" stop-color="#C9A45C"/>
      <stop offset="1" stop-color="#8F6F35"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#2B527F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0E1D31" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground -->
  <rect width="1280" height="400" fill="url(#ground)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- inset plate border -->
  <rect x="18.5" y="18.5" width="1243" height="363" fill="none" stroke="#C9A45C" stroke-opacity="0.28" stroke-width="1"/>
  <rect x="24.5" y="24.5" width="1231" height="351" fill="none" stroke="#C9A45C" stroke-opacity="0.14" stroke-width="1"/>

  <!-- corner ticks -->
  <g stroke="#C9A45C" stroke-opacity="0.55" stroke-width="1.5">
    <path d="M 40 58 V 40 H 58" fill="none"/>
    <path d="M 1222 40 H 1240 V 58" fill="none"/>
    <path d="M 1240 342 V 360 H 1222" fill="none"/>
    <path d="M 58 360 H 40 V 342" fill="none"/>
  </g>

  <!-- butler's bow tie -->
  <g transform="translate(640 108)">
    <path d="M -8 0 L -46 -17 Q -52 -19 -52 -12 L -52 12 Q -52 19 -46 17 L -8 0 Z" fill="url(#brass)"/>
    <path d="M 8 0 L 46 -17 Q 52 -19 52 -12 L 52 12 Q 52 19 46 17 L 8 0 Z" fill="url(#brass)"/>
    <rect x="-9" y="-8" width="18" height="16" rx="3" fill="#C9A45C"/>
    <rect x="-9" y="-8" width="18" height="16" rx="3" fill="none" stroke="#0E1D31" stroke-opacity="0.35"/>
  </g>

  <!-- title -->
  <text x="640" y="212" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700"
        letter-spacing="10" fill="#EFE9DA">SIR THADDEUS</text>

  <!-- tagline -->
  <text x="640" y="262" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic"
        fill="#B9C6D8">Your thoughts deserve a butler, not an audience.</text>

  <!-- brass rule with diamond -->
  <g>
    <line x1="440" y1="300" x2="620" y2="300" stroke="url(#brass)" stroke-width="1.25"/>
    <line x1="660" y1="300" x2="840" y2="300" stroke="url(#brass)" stroke-width="1.25"/>
    <rect x="634" y="294" width="12" height="12" transform="rotate(45 640 300)" fill="none" stroke="#C9A45C" stroke-width="1.25"/>
  </g>

  <!-- microcopy -->
  <text x="640" y="342" text-anchor="middle"
        font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="16"
        letter-spacing="2" fill="#7E97B5">LOCAL-FIRST&#160;&#160;·&#160;&#160;NO CLOUD&#160;&#160;·&#160;&#160;NO TELEMETRY&#160;&#160;·&#160;&#160;MEASURED, NOT GUESSED</text>
</svg>
