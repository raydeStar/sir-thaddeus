<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sir Thaddeus</title>
  <desc id="desc">A private, local-first AI workspace for Windows</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101D"/>
      <stop offset="0.5" stop-color="#10253F"/>
      <stop offset="1" stop-color="#081522"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0C36C"/>
      <stop offset="0.48" stop-color="#B98532"/>
      <stop offset="1" stop-color="#F5D695"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.2" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#D3A24E" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#D3A24E" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="1260" height="300" rx="28" fill="url(#panel)"/>
  <rect x="10.75" y="10.75" width="1258.5" height="298.5" rx="27.25" fill="none" stroke="#D3A24E" stroke-opacity="0.38" stroke-width="1.5"/>
  <rect x="26" y="26" width="1228" height="268" rx="18" fill="none" stroke="#FFF3D7" stroke-opacity="0.07"/>
  <rect x="10" y="10" width="1260" height="300" rx="28" fill="url(#halo)"/>

  <!-- Fine local-only paths -->
  <g fill="none" stroke="#D3A24E" stroke-opacity="0.16">
    <circle cx="184" cy="160" r="112"/>
    <circle cx="184" cy="160" r="88"/>
    <path d="M294 88 C382 88 364 53 452 53"/>
    <path d="M294 232 C382 232 364 267 452 267"/>
  </g>

  <!-- Sir Thaddeus signet: the primary identity stays distinct from the raven familiar. -->
  <g transform="translate(184 159)" filter="url(#shadow)">
    <circle r="78" fill="#091421" stroke="url(#brass)" stroke-width="2"/>
    <circle r="67" fill="none" stroke="#F4D590" stroke-opacity="0.16"/>
    <circle r="59" fill="none" stroke="#D3A24E" stroke-opacity="0.2" stroke-dasharray="2 6"/>
    <g font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700">
      <text x="-23" y="28" text-anchor="middle" fill="#F5EBD8">S</text>
      <text x="24" y="28" text-anchor="middle" fill="url(#brass)">T</text>
    </g>
    <path d="M-5 -3 L0 -9 L5 -3 L0 3Z" fill="#F0C36C"/>
    <path d="M-15 59 L0 51 L15 59 L0 67Z" fill="url(#brass)"/>
  </g>

  <line x1="344" y1="61" x2="344" y2="259" stroke="#D3A24E" stroke-opacity="0.28"/>

  <!-- Wordmark -->
  <text x="402" y="116" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="700" letter-spacing="7" fill="#F7EEDC">SIR THADDEUS</text>
  <text x="406" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic" fill="#C8D3E0">Your thoughts deserve a butler, not an audience.</text>
  <line x1="406" y1="186" x2="1130" y2="186" stroke="#D3A24E" stroke-opacity="0.28"/>

  <g font-family="Consolas, 'Cascadia Mono', monospace" font-size="15" letter-spacing="1.6">
    <text x="406" y="226" fill="#D3A24E">LOCAL MODELS</text>
    <text x="564" y="226" fill="#7F94AA">PRIVATE MEMORY</text>
    <text x="745" y="226" fill="#7F94AA">VISIBLE PERMISSIONS</text>
    <text x="977" y="226" fill="#7F94AA">ZERO TELEMETRY</text>
  </g>
  <circle cx="543" cy="221" r="2.5" fill="#D3A24E"/>
  <circle cx="724" cy="221" r="2.5" fill="#D3A24E"/>
  <circle cx="956" cy="221" r="2.5" fill="#D3A24E"/>

  <g stroke="#D3A24E" stroke-width="1.5" stroke-linecap="round">
    <path d="M37 61 V37 H61"/>
    <path d="M1219 37 H1243 V61"/>
    <path d="M1243 259 V283 H1219"/>
    <path d="M61 283 H37 V259"/>
  </g>
</svg>
