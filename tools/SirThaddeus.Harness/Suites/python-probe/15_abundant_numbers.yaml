id: probe_py_abundant_numbers
name: Python Probe - Abundant Numbers
rubric_profile: general
user_message: "Use the python_eval tool to compute this. An abundant number is one whose proper divisors (divisors excluding itself) sum to more than the number. How many abundant numbers are there below 100? Reply with only the integer."
allowed_tools: [python_eval]
mode: live
assertions:
  required_tools: []
  forbidden_tools:
    - web_search
    - system_execute
  allowed_tools_only: true
  require_structured_errors: true
  require_no_hallucinated_citations: true
expectations:
  required_keywords:
    - "21"
  forbidden_keywords:
    - as an ai
  max_response_chars: 400
min_score: 5.0
patch_targets:
  tier1_targets:
    - packages/agent/SirThaddeus.Agent/
  tier2_targets:
    - packages/
  tier3_targets:
    - packages/
