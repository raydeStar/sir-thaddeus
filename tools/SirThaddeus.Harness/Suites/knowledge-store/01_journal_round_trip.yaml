id: knowledge_store_journal_round_trip
name: Knowledge Store - Journal Round Trip
user_message: "Call knowledge_store_journal_log_entry in root 'harness' to save the journal entry 'I went for a three mile walk after lunch.' Then, before giving any final answer, call knowledge_store_read_file with the exact relative journal path returned by the first tool result. A final answer without that second tool call is incorrect. Do not use list tools or generic file tools. Report the journal path you used and confirm that the walk entry text is present."
allowed_tools:
  - knowledge_store_journal_log_entry
  - knowledge_store_read_file
mode: live
assertions:
  required_tools:
    - knowledge_store_journal_log_entry
    - knowledge_store_read_file
  forbidden_tools: []
  allowed_tools_only: true
  require_structured_errors: true
  require_no_hallucinated_citations: true
expectations:
  required_keywords:
    - journal
    - walk
    - .md
  forbidden_keywords: []
  max_response_chars: 700
min_score: 7.0
patch_targets:
  tier1_targets:
    - packages/knowledge-store/
    - packages/config/SirThaddeus.Config/
    - apps/mcp-server/SirThaddeus.McpServer/Tools/
  tier2_targets:
    - packages/mcp-tools-core/
    - apps/headless-runtime/
  tier3_targets:
    - packages/
    - apps/