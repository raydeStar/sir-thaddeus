id: knowledge_store_list_roots_contract
name: Knowledge Store - List Roots Contract
user_message: "Call knowledge_store_list_roots and report the configured root id and display name. Do not call generic file tools or any non-knowledge-store tools. Mention that the configured root id is harness and that its display name is Harness Knowledge Store."
allowed_tools:
  - knowledge_store_list_roots
assertions:
  required_tools:
    - knowledge_store_list_roots
  forbidden_tools: []
  allowed_tools_only: true
  require_structured_errors: true
  require_no_hallucinated_citations: true
expectations:
  required_keywords:
    - harness
    - Harness Knowledge Store
  forbidden_keywords: []
  max_response_chars: 700
min_score: 7.0
patch_targets:
  tier1_targets:
    - packages/knowledge-store/
    - packages/config/SirThaddeus.Config/
    - apps/mcp-server/SirThaddeus.McpServer/Tools/
  tier2_targets:
    - packages/mcp-tools-core/
    - apps/headless-runtime/
  tier3_targets:
    - packages/
    - apps/