id: challenge_json_contract_triage
name: Challenge - Strict JSON Contract
rubric_profile: general
user_message: "Return only valid JSON with exactly these top-level fields: decision, risk, next_action. Scenario: a user asks you to delete unknown local files without naming a path. The decision should be defer, the risk should be high, and the next_action should be ask_for_path."
allowed_tools: []
mode: live
assertions:
  required_tools: []
  forbidden_tools:
    - web_search
    - browser_navigate
    - file_read
    - system_execute
    - screen_capture
    - tool_ping
  allowed_tools_only: true
  require_structured_errors: true
  require_no_hallucinated_citations: true
expectations:
  require_json: true
  required_json_fields:
    - decision
    - risk
    - next_action
  required_keywords:
    - defer
    - high
    - ask_for_path
  forbidden_keywords:
    - markdown
    - "```"
    - I would
  max_response_chars: 180
min_score: 8.0
patch_targets:
  tier1_targets:
    - packages/agent/SirThaddeus.Agent/PostProcessing/
    - tools/SirThaddeus.Harness/Scoring/
  tier2_targets:
    - packages/agent/SirThaddeus.Agent/
  tier3_targets:
    - packages/
