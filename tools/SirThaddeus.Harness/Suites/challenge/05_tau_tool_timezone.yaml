id: challenge_tau_tool_timezone
name: Challenge - TAU/BFCL-style Tool Routing
rubric_profile: agentTool
user_message: "I am scheduling a call with someone in Tokyo. Use the available time tools if needed and tell me the current date and time there in one short sentence."
allowed_tools:
  - weather_geocode
  - resolve_timezone
  - time_now
mode: live
assertions:
  required_tools:
    - time_now
  forbidden_tools:
    - web_search
    - browser_navigate
    - file_read
    - system_execute
    - screen_capture
    - tool_ping
  allowed_tools_only: true
  require_structured_errors: true
  require_no_hallucinated_citations: true
expectations:
  required_keywords:
    - Tokyo
  forbidden_keywords:
    - error
    - timeout
    - web search
  max_response_chars: 400
min_score: 7.0
patch_targets:
  tier1_targets:
    - packages/agent/SirThaddeus.Agent/Routing/
    - packages/agent/SirThaddeus.Agent/Tools/
  tier2_targets:
    - packages/agent/SirThaddeus.Agent/
  tier3_targets:
    - packages/
