id: smoke_time_now
name: Smoke - Time Tool
user_message: "What time is it right now? Tell me in one sentence."
allowed_tools:
  - time_now
mode: live
assertions:
  # `time_now` is a valid path, but the deterministic pre-router now
  # answers "what time is it" locally from DateTimeOffset.Now without
  # burning a tool call. Both paths produce the same visible result;
  # the forbidden_tools list below ensures we still fail on web_search
  # or other tool misrouting.
  required_tools: []
  forbidden_tools:
    - system_execute
    - file_read
    - screen_capture
    - web_search
    - browser_navigate
  allowed_tools_only: true
  require_structured_errors: true
  require_no_hallucinated_citations: true
expectations:
  required_keywords:
    - time
  forbidden_keywords: []
  max_response_chars: 400
min_score: 7.0
patch_targets:
  tier1_targets:
    - packages/agent/SirThaddeus.Agent/Routing/
    - packages/agent/SirThaddeus.Agent/PolicyGate.cs
  tier2_targets:
    - packages/agent/SirThaddeus.Agent/
  tier3_targets:
    - packages/
