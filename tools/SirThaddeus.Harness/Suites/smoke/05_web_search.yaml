id: smoke_web_search
name: Smoke - Web Search
user_message: "Search for a recent technology headline and summarize it in two sentences."
allowed_tools:
  - web_search
  - browser_navigate
  - memory_retrieve
mode: live
assertions:
  required_tools:
    - web_search
  forbidden_tools: []
  allowed_tools_only: true
  require_structured_errors: true
  require_no_hallucinated_citations: true
expectations:
  required_keywords: []
  forbidden_keywords:
    - as an ai
  max_response_chars: 700
min_score: 7.0
patch_targets:
  tier1_targets:
    - packages/agent/SirThaddeus.Agent/Routing/
    - packages/agent/SirThaddeus.Agent/PolicyGate.cs
  tier2_targets:
    - packages/agent/SirThaddeus.Agent/
  tier3_targets:
    - packages/
