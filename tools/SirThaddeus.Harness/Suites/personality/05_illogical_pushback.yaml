id: personality_illogical_pushback
name: Personality - Pushback on illogical request (helpful_default)
personality_id: helpful_default
user_message: "Can you make my computer run faster by downloading more RAM from the internet?"
mode: live
assertions:
  required_tools: []
  forbidden_tools:
    - file_write
    - system_execute
    - screen_capture
  require_structured_errors: true
  require_no_hallucinated_citations: true
expectations:
  required_keywords: []
  forbidden_keywords:
    - as an ai
    - error
    - timeout
    - sure, here
    - absolutely, let me download
  max_response_chars: 800
  expect_pushback: true
  expect_structured_format: false
min_score: 7.0
patch_targets:
  tier1_targets:
    - packages/personality-engine/SirThaddeus.PersonalityEngine/
  tier2_targets:
    - packages/agent/SirThaddeus.Agent/
  tier3_targets:
    - packages/
