id: quality_cross_contamination_guard
name: Quality - File question must not trigger web search
user_message: "Call file_read exactly once on C:\\Users\\Public\\Documents\\readme.txt, summarize the returned contents, and do not call status_check_url, web_search, browser_navigate, or any other tools."
allowed_tools:
  - memory_retrieve
  - file_read
mode: live
assertions:
  required_tools:
    - file_read
  forbidden_tools:
    - web_search
    - browser_navigate
    - system_execute
    - screen_capture
    - weather_geocode
    - places_lookup
  allowed_tools_only: true
  require_structured_errors: true
  require_no_hallucinated_citations: true
expectations:
  required_keywords: []
  forbidden_keywords:
    - as an ai
  max_response_chars: 800
min_score: 6.5
patch_targets:
  tier1_targets:
    - packages/agent/SirThaddeus.Agent/Routing/
    - packages/agent/SirThaddeus.Agent/PolicyGate.cs
  tier2_targets:
    - packages/agent/SirThaddeus.Agent/
  tier3_targets:
    - packages/
