id: quality_no_bare_answers
name: Quality - Responses must have substance, not bare yes/no
user_message: "Is McDonalds in Portland OR open right now?"
allowed_tools:
  - memory_retrieve
  - places_lookup
  - web_search
  - browser_navigate
mode: live
assertions:
  required_tools: []
  forbidden_tools:
    - system_execute
    - file_read
    - file_list
    - file_write
    - screen_capture
  allowed_tools_only: true
  require_structured_errors: true
  require_no_hallucinated_citations: false
expectations:
  required_keywords:
    - mcdonalds
  forbidden_keywords:
    - as an ai
  # Bare "Yes" or "No" must fail. A good answer names the place,
  # includes hours or status, and gives actionable context.
  max_response_chars: 1400
min_score: 7.5
patch_targets:
  tier1_targets:
    - packages/agent/SirThaddeus.Agent/PostProcessing/
    - packages/agent/SirThaddeus.Agent/Routing/
  tier2_targets:
    - packages/agent/SirThaddeus.Agent/Search/
  tier3_targets:
    - packages/
