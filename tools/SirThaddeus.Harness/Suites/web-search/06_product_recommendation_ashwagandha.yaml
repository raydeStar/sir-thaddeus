id: web_product_recommendation_ashwagandha
name: Web Search - Product Recommendation (Ashwagandha on Amazon)
user_message: "Can you recommend a good Ashwagandha on Amazon.com?"
allowed_tools:
  - memory_retrieve
  - web_search
  - browser_navigate
mode: live
assertions:
  required_tools:
    - web_search
  forbidden_tools:
    - system_execute
    - file_read
    - file_list
    - file_write
    - screen_capture
  allowed_tools_only: true
  require_structured_errors: true
  require_no_hallucinated_citations: false
expectations:
  required_keywords: []
  forbidden_keywords:
    - as an ai
  max_response_chars: 1600
min_score: 7.0
patch_targets:
  tier1_targets:
    - packages/agent/SirThaddeus.Agent/Routing/
    - packages/agent/SirThaddeus.Agent/Search/
  tier2_targets:
    - packages/agent/SirThaddeus.Agent/
  tier3_targets:
    - packages/
